<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f5ef" />
    <title>Page not found · Anusha Dagar</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500&family=Space+Grotesk:wght@400;500&display=swap');
      :root { color-scheme: light; --paper:#f7f5ef; --ink:#152329; --coral:#d85d45; --teal:#2a8e97; }
      * { box-sizing:border-box; }
      body { min-height:100vh; margin:0; display:grid; place-items:center; padding:32px; color:var(--ink); background:var(--paper); font:18px/1.55 'Space Grotesk',sans-serif; }
      main { width:min(680px,100%); padding:clamp(32px,8vw,84px); border:1px solid rgba(21,35,41,.16); border-top:5px solid var(--coral); background:#ebece6; }
      .mark { color:var(--coral); font:12px 'Space Grotesk',sans-serif; letter-spacing:.16em; text-transform:uppercase; }
      h1 { margin:24px 0 18px; font:clamp(54px,10vw,96px)/.92 'Newsreader',Georgia,serif; font-weight:500; }
      p { max-width:460px; color:#526365; }
      a { display:inline-flex; margin-top:24px; padding:13px 18px; color:var(--paper); background:var(--teal); text-decoration:none; }
      a:focus-visible { outline:3px solid var(--coral); outline-offset:4px; }
    </style>
  </head>
  <body><main><span class="mark">Anusha Dagar · 404</span><h1>That route is not here.</h1><p>Head back to the portfolio and choose a section from the main page.</p><a href="/">Back to the portfolio</a></main></body>
</html>
